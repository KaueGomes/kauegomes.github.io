# =========================
# Garagem C-137 — Site config
# =========================

title: Garagem C-137
tagline: Ferramentas, guias e histórias para quem joga
author: Kaue Gomes
email: kauedellabarbagomes@gmail.com
description: >-
  Garagem C-137 é um portal independente de ferramentas, guias, detonados,
  walkthroughs e conversas sobre jogos.

baseurl: ""
url: "https://kauegomes.github.io"
github_username: KaueGomes
google_tag_manager_id: GTM-NB6NRP2K

markdown: kramdown
highlighter: rouge
lang: pt-BR
timezone: America/Sao_Paulo

plugins:
  - jekyll-feed
  - jekyll-paginate

# Home: paginação padrão
paginate: 8
paginate_path: "/page:num/"

# Categorias do site — usadas por páginas de categoria e pela busca
# Slug     → Nome de exibição
categories_map:
  guias: "Guias"
  detonados: "Detonados"
  artigos: "Artigos"

# Itens excluídos do build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - SiteExemplo/
  - .obsidian/
  - _posts/.obsidian/
  - vendor/
  - node_modules/
  - model_new_post.md

# Defaults — garantir layout post para arquivos em _posts
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
