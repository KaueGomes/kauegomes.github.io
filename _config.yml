# =========================
# Garagem C-137 — Site config
# =========================

title: Garagem C-137
tagline: Dungeon digital de tecnologia, cultura pop e construção
author: Kaue Gomes
email: kauedellabarbagomes@gmail.com
description: >-
  Garagem C-137 é a dungeon digital de Kaue Gomes — experimentos com tecnologia,
  cultura pop, games, marcenaria, Web Analytics, ferramentas e um pouco de
  filosofia de boteco. Nerd, construtor e sobrevivente dos anos 2000.

baseurl: ""
url: "https://kauegomes.github.io"
github_username: KaueGomes
google_tag_manager_id: GTM-NB6NRP2K

markdown: kramdown
highlighter: rouge
lang: pt-BR
timezone: America/Sao_Paulo

plugins:
  - jekyll-feed
  - jekyll-paginate

# Home: paginação padrão
paginate: 8
paginate_path: "/page:num/"

# Categorias do site — usadas por páginas de categoria e pela busca
# Slug     → Nome de exibição
categories_map:
  holodeck: "Holodeck"
  crafting-table: "Crafting Table"
  the-office: "The Office"
  cabo-interdimensional: "Cabo Interdimensional"

# Itens excluídos do build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - SiteExemplo/
  - .obsidian/
  - _posts/.obsidian/
  - vendor/
  - node_modules/
  - model_new_post.md

# Defaults — garantir layout post para arquivos em _posts
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
