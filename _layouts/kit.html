<!DOCTYPE html>
<html lang="{{ site.lang | default: 'pt-BR' }}">
  <head>
    {% assign asset_version = site.time | date: '%s' %}
    <meta charset="UTF-8">
    <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ page.description | default: 'Ferramentas para jogos que rodam direto no navegador.' }}">
    <link rel="icon" href="{{ '/assets/img/Favicon.ico' | relative_url }}" type="image/x-icon">
    <!-- main.css traz Font Awesome, DM Sans e os estilos do header/hambúrguer -->
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ asset_version }}">
    <!-- kit.css traz os estilos específicos das ferramentas -->
    <link rel="stylesheet" href="{{ '/assets/css/kit/kit.css' | relative_url }}?v={{ asset_version }}">
    {% include google-tag-manager-head.html %}
  </head>
  <body>
    {% include google-tag-manager-body.html %}
    <header class="site-header">
      {% include menu.html %}
    </header>

    <main class="kit-main">
      {{ content }}
    </main>

    {% include footer.html %}

    <!-- main.js gerencia o menu e os recursos de interface -->
    <script src="{{ '/assets/js/main.js' | relative_url }}?v={{ asset_version }}"></script>
  </body>
</html>
