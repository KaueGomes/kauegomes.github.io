<!DOCTYPE html>
<html lang="{{ site.lang | default: 'pt-BR' }}">
  <head>
    <meta charset="UTF-8">
    <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ page.description | default: site.description | strip_newlines | truncate: 180 }}">
    <link rel="icon" href="{{ '/assets/img/Favicon.ico' | relative_url }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/theme/light_mode.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/theme/dark_mode.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/theme/sephia_mode.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/syntax.css' | relative_url }}">
    {% include google-tag-manager-head.html %}
  </head>
  <body>
    {% include google-tag-manager-body.html %}
    <header class="site-header">
      {% include menu.html %}
    </header>
    <main class="main-content">
      <div class="page-wrap">
        {% if page.title %}<h1 class="page-title">{{ page.title }}</h1>{% endif %}
        {{ content }}
      </div>
    </main>
    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
  </body>
</html>
